<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thenawabx - Ultimate Security Operations Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --critical: #ef4444;
            --high: #f97316;
            --medium: #f59e0b;
            --dark-box: #0f172a;
        }

        body.dark-mode {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #1f2937;
            --dark-box: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-sm:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .brand-header {
            text-align: center;
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            padding: 4px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            width: 100%;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .select-filter {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-size: 0.9rem;
            background: var(--bg-color);
            color: var(--text-main);
            width: 100%;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-filter:focus {
            border-color: var(--primary);
        }

        .progress-wrapper {
            max-width: 600px;
            margin: 20px auto 0 auto;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .progress-container {
            width: 100%;
            background: var(--border);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #34d399);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .cat-pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
            transition: all 0.2s;
        }

        .cat-pill:hover {
            border-color: var(--text-sub);
            color: var(--text-main);
        }

        .cat-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .cat-count {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-sub);
        }

        .cat-pill.active .cat-count {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .section-progress {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .test-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: border-color 0.2s;
        }

        .test-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 12px;
        }

        .test-title-area {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .test-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
        }

        .badge-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .badge.where { background: rgba(56, 189, 248, 0.12); color: #0284c7; border: 1px solid rgba(56, 189, 248, 0.25); }
        .badge.critical { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.25); }
        .badge.high { background: rgba(249, 115, 22, 0.12); color: #ea580c; border: 1px solid rgba(249, 115, 22, 0.25); }
        .badge.medium { background: rgba(245, 158, 11, 0.12); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.25); }
        .badge.low { background: rgba(59, 130, 246, 0.12); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.25); }

        .steps-box {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-sub);
            margin: 12px 0;
            background: var(--bg-color);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .steps-heading {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step-list {
            margin-left: 18px;
        }

        .step-item {
            margin-bottom: 4px;
        }
        .step-item:last-child {
            margin-bottom: 0;
        }

        .payload-row {
            background: var(--dark-box);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
            border: 1px solid var(--border);
        }

        .payload-text {
            color: #38bdf8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .btn-copy {
            background: #1e293b;
            color: #f3f4f6;
            border: 1px solid #334155;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .expected-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #059669;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 12px;
        }

        .custom-note {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 0.85rem;
            margin-top: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .custom-note:focus {
            border-color: var(--primary);
        }

        .footer-action {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
            margin-bottom: 40px;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: var(--critical);
            color: white;
        }

        @media (max-width: 600px) {
            body { padding: 12px 8px; }
            .card-top { flex-direction: column; align-items: flex-start; }
            .badge-group { margin-top: 6px; }
            .filter-section { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <button class="btn-sm" onclick="exportJSON()">📥 Export JSON</button>
        <div class="nav-actions">
            <button class="btn-sm" onclick="exportMarkdown()">📄 Export MD</button>
            <button class="btn-sm" onclick="exportCSV()">📊 Export CSV</button>
            <button class="btn-sm" onclick="toggleTheme()">🌓 Theme</button>
        </div>
    </div>

    <div class="brand-header">
        <div class="logo">
            <span class="logo-icon">N</span> thenawabx
        </div>
        <div class="subtitle">Ultimate Advanced Web Security Playbook & Operations Dashboard</div>
        
        <div class="filter-section">
            <div class="filter-group">
                <label class="filter-label" for="pageFilter">Filter by Location / Page</label>
                <select id="pageFilter" class="select-filter" onchange="filterContent()">
                    <option value="all">📁 All Locations</option>
                </select>
            </div>
        </div>
        
        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="progressText">Total Progress: 0% Completed</span>
                <span id="progressCount">0/0</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <div class="categories" id="categoryContainer"></div>

    <div class="section-header">
        <div>
            <div class="section-title" id="activeCategoryTitle">SQLi</div>
            <div class="section-progress" id="catProgressText">Category Progress: 0%</div>
        </div>
        <button class="btn-sm" onclick="toggleCompleteCategory()">✓ Toggle Category Complete</button>
    </div>

    <div id="cardContainer"></div>

    <div class="footer-action">
        <button class="btn-danger" onclick="resetAllProgress()">🗑️ Reset All Progress</button>
    </div>
</div>

<script>
if (localStorage.getItem('thenawabx_theme') === 'dark') {
    document.body.classList.add('dark-mode');
}

const testCases = [
    // --- Login Page ---
    {
        id: "login_sqli",
        category: "SQLi",
        title: "SQL Injection (In-Band & Auth Bypass) [Login Page]",
        where: "Login Page",
        severity: "Critical",
        steps: [
            "Input SQL bypass payloads into the username field of the login form.",
            "Leave password empty or enter random characters.",
            "Submit the form and check if authentication logic successfully evaluates to true and grants access."
        ],
        payloads: [
            "admin' --",
            "' OR '1'='1' #",
            "admin' or '1'='1' limit 1 --"
        ],
        expected: "Bypassing login authentication without valid credentials."
    },
    {
        id: "login_blind_sqli",
        category: "SQLi",
        title: "Blind & Time-Based SQLi [Login Page]",
        where: "Login Page",
        severity: "Critical",
        steps: [
            "Target the username or password input fields on the login page.",
            "Send time-delay payloads (like SLEEP) via Burp Repeater or Intruder.",
            "Measure server response delay time to confirm database evaluation of conditional sleep commands."
        ],
        payloads: [
            "admin' AND (SELECT * FROM (SELECT(SLEEP(5)))a)--",
            "admin' AND 1=IF(2>1,SLEEP(5),0)--"
        ],
        expected: "A clear server response delay confirms time-based SQL injection on the login page."
    },
    {
        id: "login_reflected_xss",
        category: "XSS",
        title: "Reflected Cross-Site Scripting (XSS) [Login Page]",
        where: "Login Page",
        severity: "Medium",
        steps: [
            "Input HTML/JavaScript payloads into the username field on the login form.",
            "Submit the form and check if the invalid username is reflected back inside the error message or page DOM unescaped.",
            "Verify if the script executes in the context of the user's browser."
        ],
        payloads: [
            "&lt;script&gt;alert(document.domain)&lt;/script&gt;",
            "admin\"&gt;&lt;script&gt;alert(1)&lt;/script&gt;",
            "&lt;img src=x onerror=alert(document.cookie)&gt;"
        ],
        expected: "Popup alert box execution proves Reflected XSS vulnerability on the login page."
    },
    {
        id: "login_auth_bypass",
        category: "Auth & Session",
        title: "Authentication Bypass & Brute Force / Credential Stuffing [Login Page]",
        where: "Login Page",
        severity: "Critical",
        steps: [
            "Capture the login request and send it to Burp Intruder.",
            "Load a dictionary list of common username and password combinations.",
            "Run the attack at high speed to check if account locking or rate limiting is missing."
        ],
        payloads: [
            "admin / password123",
            "test / 123456",
            "root / admin"
        ],
        expected: "Ability to make thousands of login attempts without getting blocked or bypassing authentication."
    },
    {
        id: "login_weak_password",
        category: "Auth & Session",
        title: "Weak Password Policy & Missing Account Lockout [Login Page]",
        where: "Login Page",
        severity: "Medium",
        steps: [
            "Attempt logging in with incorrect credentials multiple times consecutively.",
            "Check if the application implements account lockout, CAPTCHA, or IP blocking after failed attempts."
        ],
        payloads: [
            "100+ rapid sequential failed login attempts",
            "Automated credential guessing via Burp Intruder"
        ],
        expected: "Lack of rate limiting or account lockout enables brute-force account compromise."
    },
    {
        id: "login_open_redirect",
        category: "Open Redirect",
        title: "Open Redirection via Login Return URL [Login Page]",
        where: "Login Page",
        severity: "Medium",
        steps: [
            "Observe login URLs containing return/redirect parameters (e.g., `/login?next=https://trusted.com`).",
            "Replace the return URL with an external malicious domain (e.g., `https://evil.com`).",
            "Perform a successful login and verify if the app redirects the user to the external domain."
        ],
        payloads: [
            "/login?redirect=https://evil.com",
            "/login?next=//evil.com",
            "/login?url=javascript:alert(1)"
        ],
        expected: "Successful redirection to an external malicious URL following login."
    },
    {
        id: "login_rate_limiting",
        category: "Rate Limiting",
        title: "Lack of Rate Limiting & CAPTCHA [Login Page]",
        where: "Login Page",
        severity: "Medium",
        steps: [
            "Capture the login request in Burp Suite and send it to Intruder.",
            "Configure a test payload list of 50+ password attempts for a single user account.",
            "Run the attack without throttling to check if the application blocks requests or requires CAPTCHA validation."
        ],
        payloads: [
            "High-frequency automated password guessing on /login",
            "Absence of 429 Too Many Requests response headers"
        ],
        expected: "Unlimited login requests allowed without throttling or CAPTCHA implementation."
    },

    // --- URL Parameters & Headers ---
    {
        id: "url_blind_sqli",
        category: "SQLi",
        title: "Blind & Time-Based SQL Injection [URL Parameters & Headers]",
        where: "URL Parameters & Headers",
        severity: "Critical",
        steps: [
            "Find query parameters in URLs (e.g., ?id=1) or HTTP headers (User-Agent, Cookie, Referer).",
            "Send the request to Burp Repeater or Intruder.",
            "Test boolean conditions and insert time-delay payloads (like SLEEP) into the parameter or header.",
            "Measure server response delay time to confirm execution."
        ],
        payloads: [
            "1' AND (SELECT * FROM (SELECT(SLEEP(5)))a)--",
            "1' AND 1=1 --",
            "X-Forwarded-For: 1' AND (SELECT * FROM (SELECT(SLEEP(5)))a)--"
        ],
        expected: "A clear server delay or response change confirms Blind or Time-based SQLi."
    },
    {
        id: "url_header_injection",
        category: "RCE & Injection",
        title: "Header Injection (X-Forwarded-For ইত্যাদি) [URL Parameters & Headers]",
        where: "URL Parameters & Headers",
        severity: "High",
        steps: [
            "Inject strings, payloads, or XSS scripts into HTTP headers like `X-Forwarded-For`, `Referer`, or `User-Agent`.",
            "Check if values are reflected back or processed unsafely in application logs or admin dashboards."
        ],
        payloads: [
            "X-Forwarded-For: &lt;script&gt;alert(1)&lt;/script&gt;",
            "Referer: ' OR 1=1--"
        ],
        expected: "Unsafe reflection or processing of HTTP header values."
    },
    {
        id: "url_reflected_xss",
        category: "XSS",
        title: "Reflected Cross-Site Scripting (XSS) [URL Parameters & Headers]",
        where: "URL Parameters & Headers",
        severity: "High",
        steps: [
            "Find input areas like query parameters in URLs or custom error message parameters.",
            "Type HTML/JavaScript script tags and submit them.",
            "Check if the browser runs the script instead of showing plain text."
        ],
        payloads: [
            "&lt;script&gt;alert(document.domain)&lt;/script&gt;",
            "&lt;img src=x onerror=alert(1)&gt;"
        ],
        expected: "Pop-up alert box execution in the browser proves Reflected XSS."
    },

    // --- Profile Form & Feedback Box ---
    {
        id: "profile_second_sqli",
        category: "SQLi",
        title: "Second-Order SQL Injection [Profile Form & Feedback Box]",
        where: "Profile Form & Feedback Box",
        severity: "Critical",
        steps: [
            "Put SQL payloads into fields that save data safely for later use (e.g., full name, user bio, feedback form).",
            "Verify the data saves successfully without showing an error immediately.",
            "Go to another page where this saved user data is displayed and used inside a backend database search or report query."
        ],
        payloads: [
            "admin'--",
            "test'; DROP TABLE logs; --",
            "john'; UPDATE users SET role='admin' WHERE username='john'--"
        ],
        expected: "Unsafe use of saved data in secondary database queries confirms Second-Order SQLi."
    },
    {
        id: "profile_stored_xss",
        category: "XSS",
        title: "Stored Cross-Site Scripting (XSS) [Profile Form & Feedback Box]",
        where: "Profile Form & Feedback Box",
        severity: "Critical",
        steps: [
            "Find fields where text is saved permanently on the server (profile info, feedback box).",
            "Submit a script payload into the field and save it.",
            "Log in with a different user account and check if the script runs automatically."
        ],
        payloads: [
            "&lt;script&gt;alert(document.cookie)&lt;/script&gt;",
            "&lt;img src=x onerror=alert(1)&gt;"
        ],
        expected: "Automatic script execution when viewing stored profile/feedback data."
    },
    {
        id: "profile_mass_assignment",
        category: "IDOR & Access",
        title: "Mass Assignment / Parameter Pollution [Profile Form & Feedback Box]",
        where: "Profile Form & Feedback Box",
        severity: "High",
        steps: [
            "Capture the request sent when updating profile details.",
            "Add privileged keys into the JSON body (e.g., `\"role\": \"admin\"`).",
            "Submit the request and check if the backend binds restricted properties without validation."
        ],
        payloads: [
            "{\"username\": \"test\", \"role\": \"admin\"}",
            "{\"is_admin\": true}"
        ],
        expected: "Privilege escalation or unauthorized property modification via mass assignment."
    },

    // --- Checkout Form & Registration API ---
    {
        id: "checkout_stacked_sqli",
        category: "SQLi",
        title: "Stacked Queries SQL Injection [Checkout Form & Registration API]",
        where: "Checkout Form & Registration API",
        severity: "Critical",
        steps: [
            "Find database insert points during product orders or user registration fields.",
            "Add a semicolon (;) to end the current statement and write a second independent query.",
            "Test if the database engine executes multiple queries at once."
        ],
        payloads: [
            "1; WAITFOR DELAY '0:0:5'--",
            "1; UPDATE users SET role='admin' WHERE id=1--"
        ],
        expected: "Execution of multiple independent database commands in sequence."
    },
    {
        id: "checkout_price_manipulation",
        category: "Business Logic",
        title: "Price Manipulation & Negative Quantity Checkout [Checkout Form & Registration API]",
        where: "Checkout Form & Registration API",
        severity: "High",
        steps: [
            "Capture the checkout or cart update request in Burp Suite.",
            "Change item prices, discount values, or set quantities to negative numbers (e.g., quantity=-1).",
            "Forward the modified request and check if the total payable amount drops."
        ],
        payloads: [
            "price=0.01",
            "quantity=-1",
            "discount_percentage=100"
        ],
        expected: "Successful order creation with altered prices or negative totals."
    },
    {
        id: "checkout_business_logic",
        category: "Business Logic",
        title: "Business Logic & Workflow Bypasses [Checkout Form & Registration API]",
        where: "Checkout Form & Registration API",
        severity: "High",
        steps: [
            "Capture checkout or registration API steps and test skipping intermediate parameters or steps.",
            "Check if backend enforces strict validation on workflow sequences."
        ],
        payloads: [
            "Skipping step parameter in wizard forms",
            "Direct API call to finalize order without payment token"
        ],
        expected: "Bypassing essential application business constraints."
    },

    // --- Search Bar & Profile Inputs ---
    {
        id: "search_oast_sqli",
        category: "SQLi",
        title: "Out-of-Band (OAST) SQL Injection [Search Bar & Profile Inputs]",

let activeCategory = "SQLi";

function getSavedData() {
    try {
        const saved = localStorage.getItem('thenawabx_sec_ops_data');
        return saved ? JSON.parse(saved) : { status: {}, notes: {} };
    } catch (e) {
        return { status: {}, notes: {} };
    }
}

function saveData(data) {
    try {
        localStorage.setItem('thenawabx_sec_ops_data', JSON.stringify(data));
    } catch (e) {
        console.error("Storage error:", e);
    }
}

function updatePageFilterOptions() {
    const select = document.getElementById('pageFilter');
    const currentValue = select.value;
    
    let optionsHtml = '<option value="all">📁 All Locations</option>';
    const uniqueLocations = [...new Set(testCases.map(item => item.where))];
    
    uniqueLocations.forEach(loc => {
        optionsHtml += `<option value="${loc}">${loc}</option>`;
    });

    select.innerHTML = optionsHtml;
    select.value = currentValue;
}

function renderCategories() {
    const container = document.getElementById('categoryContainer');
    const categories = [...new Set(testCases.map(item => item.category))];
    const data = getSavedData();
    const pageFilterValue = document.getElementById('pageFilter').value;
    
    container.innerHTML = '';

    categories.forEach(cat => {
        const catItems = testCases.filter(i => {
            const matchesCat = i.category === cat;
            const matchesPage = pageFilterValue === 'all' || i.where === pageFilterValue;
            return matchesCat && matchesPage;
        });

        const total = catItems.length;
        const completed = catItems.filter(i => data.status[i.id]).length;

        const pill = document.createElement('div');
        pill.className = `cat-pill ${activeCategory === cat ? 'active' : ''}`;
        pill.onclick = () => {
            activeCategory = cat;
            document.getElementById('activeCategoryTitle').innerText = `${cat} Vulnerabilities`;
            renderCategories();
            filterContent();
        };
        
        pill.innerHTML = `${cat} <span class="cat-count">${completed}/${total}</span>`;
        container.appendChild(pill);
    });
}

function renderCards(cardsToRender) {
    const container = document.getElementById('cardContainer');
    container.innerHTML = '';
    const data = getSavedData();

    if (cardsToRender.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-sub);">No matching test cases found for this filter combination.</div>';
        return;
    }

    cardsToRender.forEach((item, index) => {
        const isChecked = !!data.status[item.id];
        const savedNote = data.notes[item.id] || '';
        const card = document.createElement('div');
        card.className = 'test-card';
        
        let stepsHtml = '<div class="steps-heading">Step to Check</div><ol class="step-list">';
        item.steps.forEach(step => {
            stepsHtml += `<li class="step-item">${escapeHtml(step)}</li>`;
        });
        stepsHtml += '</ol>';

        let payloadsHtml = '';
        item.payloads.forEach(payload => {
            const safePayload = escapeHtml(payload).replace(/'/g, "\\'");
            payloadsHtml += `
                <div class="payload-row">
                    <span class="payload-text">${escapeHtml(payload)}</span>
                    <button class="btn-copy" onclick="copyText('${safePayload}', this)">Copy</button>
                </div>
            `;
        });

        card.innerHTML = `
            <div class="card-top">
                <div class="test-title-area">
                    <input type="checkbox" id="check-${item.id}" ${isChecked ? 'checked' : ''} onchange="toggleStatus('${item.id}')" style="width:20px; height:20px; cursor:pointer; margin-top:2px; accent-color: var(--primary);">
                    <label for="check-${item.id}" class="test-title" style="cursor:pointer;">${index + 1}. ${escapeHtml(item.title)}</label>
                </div>
                <div class="badge-group">
                    <span class="badge where">${escapeHtml(item.where)}</span>
                    <span class="badge ${item.severity.toLowerCase()}">${item.severity}</span>
                </div>
            </div>
            <div class="steps-box">${stepsHtml}</div>
            <div>${payloadsHtml}</div>
            <div class="expected-box"><strong>Expected Result:</strong> ${escapeHtml(item.expected)}</div>
            <input type="text" class="custom-note" placeholder="✍️ Write custom notes or findings here..." value="${escapeHtml(savedNote)}" oninput="saveNote('${item.id}', this.value)">
        `;

        container.appendChild(card);
    });

    updateProgressStats();
}

function filterContent() {
    const pageFilterValue = document.getElementById('pageFilter').value;

    const filtered = testCases.filter(item => {
        const matchesCategory = item.category === activeCategory;
        const matchesPage = pageFilterValue === 'all' || item.where === pageFilterValue;
        
        return matchesCategory && matchesPage;
    });

    renderCategories();
    renderCards(filtered);
}

function updateProgressStats() {
    const data = getSavedData();
    const total = testCases.length;
    const completed = Object.keys(data.status).filter(k => data.status[k]).length;
    const totalPercent = total > 0 ? Math.round((completed / total) * 100) : 0;

    document.getElementById('progressBar').style.width = `${totalPercent}%`;
    document.getElementById('progressText').innerText = `Total Progress: ${totalPercent}% Completed`;
    document.getElementById('progressCount').innerText = `${completed}/${total}`;

    const pageFilterValue = document.getElementById('pageFilter').value;

    const catItems = testCases.filter(i => {
        const matchesCat = i.category === activeCategory;
        const matchesPage = pageFilterValue === 'all' || i.where === pageFilterValue;
        return matchesCat && matchesPage;
    });

    const catCompleted = catItems.filter(i => data.status[i.id]).length;
    const catPercent = catItems.length > 0 ? Math.round((catCompleted / catItems.length) * 100) : 0;
    document.getElementById('catProgressText').innerText = `Category Progress: ${catPercent}% (${catCompleted}/${catItems.length})`;
}

function toggleStatus(id) {
    const data = getSavedData();
    const checkbox = document.getElementById(`check-${id}`);

    if (checkbox.checked) {
        data.status[id] = true;
    } else {
        delete data.status[id];
    }

    saveData(data);
    renderCategories();
    updateProgressStats();
}

function toggleCompleteCategory() {
    const data = getSavedData();
    const pageFilterValue = document.getElementById('pageFilter').value;

    const catItems = testCases.filter(i => {
        const matchesCat = i.category === activeCategory;
        const matchesPage = pageFilterValue === 'all' || i.where === pageFilterValue;
        return matchesCat && matchesPage;
    });

    const allCompleted = catItems.every(i => data.status[i.id]);

    catItems.forEach(i => {
        if (allCompleted) {
            delete data.status[i.id];
        } else {
            data.status[i.id] = true;
        }
    });

    saveData(data);
    renderCategories();
    filterContent();
}

function saveNote(id, value) {
    const data = getSavedData();
    data.notes[id] = value;
    saveData(data);
}

function copyText(text, button) {
    navigator.clipboard.writeText(text).then(() => {
        const orig = button.innerText;
        button.innerText = "Copied!";
        button.style.background = "var(--success)";
        button.style.borderColor = "var(--success)";
        button.style.color = "#ffffff";
        setTimeout(() => {
            button.innerText = orig;
            button.style.background = "";
            button.style.borderColor = "";
            button.style.color = "";
        }, 1200);
    });
}

function resetAllProgress() {
    if (confirm("Are you sure you want to reset all completion progress and notes?")) {
        localStorage.removeItem('thenawabx_sec_ops_data');
        renderCategories();
        filterContent();
    }
}

function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('thenawabx_theme', isDark ? 'dark' : 'light');
}

function exportJSON() {
    const data = getSavedData();
    const exportObj = { testCases, userProgress: data };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
    const dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "thenawabx_dashboard.json");
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
}

function exportMarkdown() {
    let md = "# thenawabx Security Operations Dashboard\n\n";
    testCases.forEach((item, i) => {
        md += `### ${i + 1}. ${item.title}\n`;
        md += `- **Category:** ${item.category}\n- **Severity:** ${item.severity}\n- **Where to test:** ${item.where}\n`;
        md += `**Step to Check:**\n${item.steps.map((s, idx) => `  ${idx + 1}. ${s}`).join('\n')}\n`;
        md += `**Payloads:**\n${item.payloads.map(p => `  - \`${p}\``).join('\n')}\n\n`;
    });
    const dataStr = "data:text/markdown;charset=utf-8," + encodeURIComponent(md);
    const dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "thenawabx_dashboard.md");
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
}

function exportCSV() {
    let csv = "ID,Category,Title,Severity,Location,Expected Result\n";
    testCases.forEach(item => {
        let title = `"${item.title.replace(/"/g, '""')}"`;
        let expected = `"${item.expected.replace(/"/g, '""')}"`;
        csv += `${item.id},${item.category},${title},${item.severity},${item.where},${expected}\n`;
    });
    const dataStr = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    const dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "thenawabx_dashboard.csv");
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

updatePageFilterOptions();
renderCategories();
filterContent();
