id: THENAWABX_STRIPE_KEYS
info:
  name: 💳 Nawab-Stripe-Keys-Hunter 💳
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/config.js"
      - "{{BaseURL}}/main.js"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "sk_live_[0-9a-zA-Z]{24,}"
          - "pk_live_[0-9a-zA-Z]{24,}"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "sk_live_123456789"
          - "your_stripe_key"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "sk_live_[0-9a-zA-Z]{24,}"
          - "pk_live_[0-9a-zA-Z]{24,}"
