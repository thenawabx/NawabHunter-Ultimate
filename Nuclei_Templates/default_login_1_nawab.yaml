id: nawab-default-login
info:
  name: Verified Default Admin Login
  author: thenawabx
  severity: critical
http:
  - method: POST
    path:
      - "{{BaseURL}}/login"
    body: "user=admin&pass=admin"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome Admin"
          - "Login Success"
        part: body
      - type: status
        status:
          - 200
