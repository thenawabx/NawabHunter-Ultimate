id: THENAWABX_FOUND_INFO
info:
  name: 📑 Nawab-Information-Extractor 📑
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "thenawabx_test"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "AIzaSy[A-Za-z0-9_-]{35}"
          - "https://[a-z0-9.-]+\\.firebaseio\\.com"
