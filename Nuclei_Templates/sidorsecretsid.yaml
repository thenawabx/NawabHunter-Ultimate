id: THENAWABX_ACCOUNT_SID_HUNTER
info:
  name: Nawab-Account-SID-Hunter
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "\bAC[a-f0-9]{32}\b"
          - "\bSK[a-f0-9]{32}\b"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "AC00000000000000000000000000000000"
          - "SK00000000000000000000000000000000"
          - "example"
          - "placeholder"
          - "documentation"
          - "tutorial"
          - "your_account_sid"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "\bAC[a-f0-9]{32}\b"
          - "\bSK[a-f0-9]{32}\b"
