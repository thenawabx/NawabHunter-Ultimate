Id: THENAWABX_ACCOUNT_SID_HUNTER
info:
  name: 📑 Nawab-Account-SID-Hunter 📑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "AC[a-f0-9]{32}"
          - "SK[a-f0-9]{32}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "AC[a-f0-9]{32}"
          - "SK[a-f0-9]{32}"
        condition: or
