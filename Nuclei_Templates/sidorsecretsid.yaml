id: THENAWABX_ACCOUNT_SID_HUNTER
info:
  name: 📞 Nawab-Account-SID-Hunter 📞
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "AC[a-f0-9]{32}"
          - "SK[a-f0-9]{32}"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "AC00000000000000000000000000000000"
          - "SK00000000000000000000000000000000"
          - "example"
          - "placeholder"

    extractors:
      - type: regex
        part: body
        regex:
          - "AC[a-f0-9]{32}"
          - "SK[a-f0-9]{32}"
