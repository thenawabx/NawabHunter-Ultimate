id: THENAWABX_PRIVATE_KEY_HUNTER
info:
  name: 🔑 Nawab-Private-Key-Hunter 🔑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "-----BEGIN (RSA|EC|OPENSSH|DSA|ENCRYPTED) PRIVATE KEY-----"

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "placeholder"
          - "tutorial"
          - "sample"
          - "YOUR_PRIVATE_KEY"

    extractors:
      - type: regex
        part: body
        regex:
          - "-----BEGIN [A-Z ]+ PRIVATE KEY-----[\\s\\S]*?-----END [A-Z ]+ PRIVATE KEY-----"
