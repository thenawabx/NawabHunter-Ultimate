id: THENAWABX_GCP_BUCKET_HUNTER
info:
  name: 🪣 Nawab-GCP-Bucket-Hunter 🪣
  author: thenawabx
  severity: medium

http:
  - method: GET
    path:
      - "https://www.googleapis.com/storage/v1/b/{{Host}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "\"kind\": \"storage#bucket\""
          - "\"id\":"
          - "\"location\":"
        condition: and

      - type: word
        part: body
        negative: true
        words:
          - "Required"
          - "Login"
          - "Example"
          - "AccessDenied"

    extractors:
      - type: regex
        part: body
        regex:
          - "\"selfLink\": \"https://www.googleapis.com/storage/v1/b/[a-z0-9.-]+\""
