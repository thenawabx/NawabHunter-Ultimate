id: Nawab_info

info:
  name: ⚡ Nawab-Information-Extractor ⚡
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "altKey"
          - "ctrlKey"
          - "keyCode"
          - "shiftKey"
        negative: true

    extractors:
      - type: regex
        name: FOUND_GOOGLE_API
        part: body
        regex:
          - "AIzaSy[A-Za-z0-9_-]{35}"

      - type: regex
        name: FOUND_SECRET
        part: body
        regex:
          - "(?i)(password|pwd|secret|db_pass)\\s*[:=]\\s*['\"]([A-Za-z0-9@#$%^&*]{6,100})['\"]"
          - "(?i)(api_key|token|auth_token|jwt_secret|access_key)\\s*[:=]\\s*['\"]?[A-Za-z0-9-_]{20,}"

      - type: regex
        name: FOUND_FIREBASE
        part: body
        regex:
          - "https://[a-z0-9.-]+\\.firebaseio\\.com"
