id: THENAWABX_SENSITIVE_BACKUP_HUNTER
info:
  name: Nawab-Sensitive-Backup-Hunter
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.php.bak"
      - "{{BaseURL}}/config.save"
      - "{{BaseURL}}/.env.old"
      - "{{BaseURL}}/backup.sql"
      - "{{BaseURL}}/.db_backup"
      - "{{BaseURL}}/db.sql.gz"
      - "{{BaseURL}}/.env.bak"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "(?i)(DB_PASSWORD|MYSQL_ROOT_PASSWORD|AUTH_TOKEN|SECRET_KEY|aws_secret_access_key)"

      - type: word
        part: body
        negative: true
        words:
          - "example_password"
          - "your_secret_key"
          - "<html"
          - "<body"
          - "placeholder"
          - "page not found"
          - "404"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)(DB_PASSWORD|MYSQL_ROOT_PASSWORD|AUTH_TOKEN|SECRET_KEY)[^\n]*=[^\n]*"
