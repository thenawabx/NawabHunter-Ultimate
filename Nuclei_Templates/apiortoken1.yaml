Id: THENAWABX_FOUND_API_OR_TOKEN
info:
  name: 📑 Nawab-Sensitive-Token-Hunter 📑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "AIzaSy[A-Za-z0-9_-]{35}"
          - "ey[a-zA-Z0-9_-]{10,}\\.ey[a-zA-Z0-9_-]{10,}\\.[a-zA-Z0-9_-]{10,}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "AIzaSy[A-Za-z0-9_-]{35}"
          - "ey[a-zA-Z0-9_-]{10,}\\.ey[a-zA-Z0-9_-]{10,}"
        condition: or
