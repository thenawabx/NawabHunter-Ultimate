id: THENAWABX_FOUND_API_OR_TOKEN
info:
  name: 📑 Nawab-Sensitive-Token-Hunter 📑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "AIzaSy[A-Za-z0-9_-]{35}"
          - "ey[a-zA-Z0-9_-]{15,}\\.ey[a-zA-Z0-9_-]{15,}\\.[a-zA-Z0-9_-]{10,}"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "YOUR_API_KEY"
          - "EXAMPLE_TOKEN"
          - "example.com"
          - "template"
          - "placeholder"
          - "your-token-here"
          - "<api-key>"
          - "test_token"
          - "fake_key"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "AIzaSy[A-Za-z0-9_-]{35}"
          - "ey[a-zA-Z0-9_-]{15,}\\.ey[a-zA-Z0-9_-]{15,}\\.[a-zA-Z0-9_-]{10,}"
