id: nawab-confirmed-secrets

info:
  name: 🔍 Nawab-Confirmed-Secrets 🔍
  author: thenawabx

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.git/config"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "AWS_ACCESS_KEY_ID"
          - "DB_PASSWORD"
          - "SECRET_KEY"
        part: body
        condition: or

      - type: status
        status:
          - 200
