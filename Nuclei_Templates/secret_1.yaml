id: nawab-confirmed-secrets

info:
  name: 🔍 Nawab-Confirmed-Secrets 🔍
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      secret_payloads:
        - "/.env"
        - "/.git/config"
        - "/config.js"
        - "/.aws/credentials"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{secret_payloads}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "AKIA[0-9A-Z]{16}"
          - "(DB|MYSQL|POSTGRES)_(PASSWORD|PWD|USER|HOST)\\s*[:=]\\s*.*"
          - "repositoryformatversion\\s*=\\s*0"
          - "(?i)(password|pwd|secret|auth_key|db_pass)\\s*[:=]\\s*['\"]([A-Za-z0-9@#$%^&*]{6,100})['\"]"
          - "(?i)(api_key|token|jwt_secret)\\s*[:=]\\s*['\"]?[A-Za-z0-9-_]{20,}"

      - type: word
        words:
          - "Access Denied"
          - "404 Not Found"
          - "<html>"
          - "var altKey"
          - "var ctrlKey"
          - "keyCode"
        part: body
        negative: true
