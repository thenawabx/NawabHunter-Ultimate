id: nawab-smart-secret-extractor

info:
  name: 🔍 Nawab-Smart-Secret-Extractor 🔍
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.git/config"
      - "{{BaseURL}}/js/app.js"

    matchers:
      - type: regex
        name: "🔍🔍 [FOUND] SECRET-EXPOSED: SENSITIVE-DATA 🔍🔍"
        regex:
          - "(?i)(api_key|password|auth_token|secret)"
        part: body

    extractors:
      - type: regex
        name: extracted-secret
        group: 1
        regex:
          - '(?i)(?:password|api_key|auth_token|secret)["'']?\s*[:=]\s*["'']([a-zA-Z0-9@#$%^&*_\-]{6,128})["'']'
        part: body
