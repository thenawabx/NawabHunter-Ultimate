id: THENAWABX_AWS_ACCESS_KEY
info:
  name: ☁️ Nawab-AWS-Access-Key-Hunter ☁️
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/aws.json"
      - "{{BaseURL}}/credentials"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "AKIA[0-9A-Z]{16}"

      - type: word
        part: body
        negative: true
        words:
          - "AKIAIOSFODNN7EXAMPLE"
          - "YOUR_AWS_KEY"
          - "example"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "AKIA[0-9A-Z]{16}"
