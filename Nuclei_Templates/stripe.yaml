id: THENAWABX_STRIPE_KEY_HUNTER
info:
  name: 💳 Nawab-Stripe-Key-Hunter 💳
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "sk_live_[0-9a-zA-Z]{24,}"
          - "pk_live_[0-9a-zA-Z]{24,}"
          - "rk_live_[0-9a-zA-Z]{24,}"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "sk_live_000000000000000000000000"
          - "pk_live_000000000000000000000000"
          - "example"
          - "placeholder"
          - "YOUR_STRIPE_KEY"

    extractors:
      - type: regex
        part: body
        regex:
          - "(sk|pk|rk)_live_[0-9a-zA-Z]{24,}"
