id: THENAWABX_PRIVATE_KEY
info:
  name: 🔑 Nawab-Private-Key-Hunter 🔑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/.ssh/id_rsa"
      - "{{BaseURL}}/id_rsa"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "BEGIN RSA PRIVATE KEY"
        part: body

      - type: word
        part: body
        negative: true
        words:
          - "EXAMPLE PRIVATE KEY"
          - "placeholder"
        condition: or
