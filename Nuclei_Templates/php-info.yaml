id: THENAWABX_PHP_INFO_HUNTER
info:
  name: 🐘 Nawab-PHP-Info-Hunter 🐘
  author: thenawabx
  severity: low

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/info.php"
      - "{{BaseURL}}/test.php"
      - "{{BaseURL}}/php.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "PHP Version"
          - "Configuration File (php.ini) Path"
          - "PHP Development Team"
          - "System"
        condition: and

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "placeholder"
          - "syntax"
          - "tutorial"

    extractors:
      - type: regex
        part: body
        regex:
          - "PHP Version [0-9.]+"
