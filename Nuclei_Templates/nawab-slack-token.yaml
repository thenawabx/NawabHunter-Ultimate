id: THENAWABX_SLACK_TOKEN
info:
  name: 💬 Nawab-Slack-Token-Hunter 💬
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/config.json"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "xox[baprs]-[0-9a-zA-Z]{10,48}"

      - type: word
        part: body
        negative: true
        words:
          - "xoxb-your-token-here"
          - "example_token"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "xox[baprs]-[0-9a-zA-Z]{10,48}"
