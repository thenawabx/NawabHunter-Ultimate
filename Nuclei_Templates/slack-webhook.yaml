id: THENAWABX_SLACK_WEBHOOK_HUNTER
info:
  name: Nawab-Slack-Webhook-Hunter
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "https://hooks\\.slack\\.com/services/T[a-zA-Z0-9_]{8,11}/B[a-zA-Z0-9_]{8,11}/[a-zA-Z0-9_]{24}"

      - type: word
        part: body
        negative: true
        words:
          - "T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
          - "YOUR_WEBHOOK_URL"
          - "example"
          - "placeholder"
          - "documentation"
          - "how to create slack webhook"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "https://hooks\\.slack\\.com/services/T[a-zA-Z0-9_]{8,11}/B[a-zA-Z0-9_]{8,11}/[a-zA-Z0-9_]{24}"
