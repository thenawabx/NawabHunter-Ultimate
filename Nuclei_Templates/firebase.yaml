id: THENAWABX_FIREBASE_DB_HUNTER
info:
  name: 🔥 Nawab-Firebase-DB-Hunter 🔥
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "https?://[a-z0-9.-]+\\.firebaseio\\.com"

      - type: word
        part: body
        negative: true
        words:
          - "project-id"
          - "your-app"
          - "example-firebase"
          - "test-db"

    extractors:
      - type: regex
        part: body
        regex:
          - "https?://[a-z0-9.-]+\\.firebaseio\\.com"
