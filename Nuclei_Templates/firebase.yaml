id: THENAWABX_FIREBASE_DB_HUNTER
info:
  name: Nawab-Firebase-DB-Hunter
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "\bhttps?://[a-z0-9-]{3,63}\.firebaseio\.com\b"

      - type: word
        part: body
        negative: true
        words:
          - "project-id"
          - "your-app"
          - "example-firebase"
          - "test-db"
          - "placeholder"
          - "documentation"
          - "tutorial"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "\bhttps?://[a-z0-9-]{3,63}\.firebaseio\.com\b"
