Id: THENAWABX_FIREBASE_DB_HUNTER
info:
  name: 📑 Nawab-Firebase-DB-Hunter 📑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "https?://[a-z0-9.-]+\\.firebaseio\\.com"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "https?://[a-z0-9.-]+\\.firebaseio\\.com"
