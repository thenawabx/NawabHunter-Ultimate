id: THENAWABX_AWS_KEY_HUNTER
info:
  name: Nawab-AWS-Key-Hunter
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "\b(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b"

      - type: word
        part: body
        negative: true
        words:
          - "AKIAIOSFODNN7EXAMPLE"
          - "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          - "EXAMPLE"
          - "placeholder"
          - "how to setup aws"
          - "documentation"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "\b(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b"
