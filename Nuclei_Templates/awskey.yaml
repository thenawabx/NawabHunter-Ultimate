Id: THENAWABX_AWS_KEY_HUNTER
info:
  name: 📑 Nawab-AWS-Key-Hunter 📑
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?:AKIA|ASIA)[0-9A-Z]{16}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - "(?:AKIA|ASIA)[0-9A-Z]{16}"
