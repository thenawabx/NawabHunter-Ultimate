id: THENAWABX_API_CREDENTIALS
info:
  name: 📞 Nawab-API-Credentials-Hunter 📞
  author: thenawabx
  severity: critical

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/config.js"
      - "{{BaseURL}}/settings.py"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "AC[a-f0-9]{32}"
          - "AIzaSy[A-Za-z0-9_-]{35}"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "YOUR_API_KEY"
          - "AC00000000000000000000000000000000"
          - "placeholder"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "AC[a-f0-9]{32}"
          - "AIzaSy[A-Za-z0-9_-]{35}"
