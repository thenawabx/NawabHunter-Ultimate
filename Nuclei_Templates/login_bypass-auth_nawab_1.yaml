id: nawab-auth-found

info:
  name: 🔑 Nawab-Default-Auth-Scanner 🔑
  author: thenawabx
  severity: critical

http:
  - method: POST
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/admin/login"
    body: "user=admin&pass=admin"
    
    matchers-condition: and
    matchers:
      - type: word
        name: "!!! [FOUND] ADMIN-LOGIN-SUCCESS: DEFAULT-CREDENTIALS !!!"
        words:
          - "Welcome Admin"
          - "Login Success"
          - "dashboard"
        part: body
      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: extracted-secrets
        regex:
          - '(?i)(api_key|password|auth_token|secret)[\s]*[:=][\s]*["'']([a-zA-Z0-9@#$%^&*]{6,64})["'']'
        part: body